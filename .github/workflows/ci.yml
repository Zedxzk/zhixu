name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Update packaging toolchain
        run: python -m pip install --upgrade "pip>=26.1.2"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Architecture boundaries
        run: lint-imports
      - name: Test
        run: pytest -q
      - name: Privacy boundary
        run: python scripts/privacy_scan.py --tracked-only
      - name: Secret scan
        run: git ls-files -z | xargs -0 detect-secrets-hook
      - name: Dependency audit
        run: pip-audit
