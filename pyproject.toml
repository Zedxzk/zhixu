[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zhixu"
version = "0.1.0.dev0"
description = "Privacy-first self-hosted personal assistant with deterministic workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "cryptography>=49,<50",
    "pydantic>=2.7,<3",
    "python-dateutil>=2.9,<3",
    "webauthn>=3,<4",
    "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "detect-secrets>=1.5,<2",
    "import-linter>=2.1,<3",
    "pip-audit>=2.7",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
zhixu = "zhixu.cli:main"
zhixu-api = "zhixu.runtime.api:main"
zhixu-backup = "zhixu.runtime.backup:main"
zhixu-outbound = "zhixu.runtime.outbound:main"
zhixu-qq = "zhixu.runtime.channel_qq:main"
zhixu-worker = "zhixu.runtime.worker:main"
zhixu-vault = "zhixu_vault.cli:main"
zhixu-vault-backup = "zhixu_vault.backup_runtime:main"
zhixu-vault-runtime = "zhixu_vault.runtime:main"
zhixu-pat-executor = "zhixu_integration.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixu", "src/zhixu_vault", "src/zhixu_integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_packages = ["zhixu", "zhixu_vault", "zhixu_integration"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "domain is independent from application and infrastructure"
type = "forbidden"
source_modules = ["zhixu.domain"]
forbidden_modules = [
    "zhixu.adapters",
    "zhixu.application",
    "zhixu.channels",
    "zhixu.delivery",
    "zhixu.runtime",
    "zhixu.security",
    "zhixu.vault_client",
]

[[tool.importlinter.contracts]]
name = "application uses ports instead of concrete adapters"
type = "forbidden"
source_modules = ["zhixu.application"]
forbidden_modules = ["zhixu.adapters"]

[[tool.importlinter.contracts]]
name = "assistant and channel code cannot import vault implementation"
type = "forbidden"
source_modules = [
    "zhixu.application",
    "zhixu.channels",
    "zhixu.adapters.channels",
    "zhixu.adapters.llm",
]
forbidden_modules = ["zhixu_vault"]

[[tool.importlinter.contracts]]
name = "vault implementation is independent from ordinary application"
type = "forbidden"
source_modules = ["zhixu_vault"]
forbidden_modules = ["zhixu"]

[[tool.importlinter.contracts]]
name = "ports do not depend on concrete adapters"
type = "forbidden"
source_modules = ["zhixu.ports"]
forbidden_modules = ["zhixu.adapters"]

[[tool.importlinter.contracts]]
name = "integration executor is isolated from application and vault implementation"
type = "forbidden"
source_modules = ["zhixu_integration"]
forbidden_modules = ["zhixu", "zhixu_vault"]
